# Runs the website checks in tests/ (consent banner, Google Analytics gating, privacy policy, footer links,
# no third-party requests, accessibility) on every pull request. Dev-only: nothing here is published.
# Also the CI gate for .github/workflows/dependabot-auto-merge.yml.
name: Site tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    # Pinned: ubuntu-latest is 26.04 now, which Playwright 1.55 can't install browsers on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - name: Audit the test tooling (high and critical)
        run: npm audit --audit-level=high
