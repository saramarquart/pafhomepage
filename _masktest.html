<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#0e120b;width:840px;height:840px;position:relative}
  div.m{position:absolute;width:360px;height:360px;background:crimson;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}
  /* A: black icon via -webkit-mask (alpha) */
  .A{top:20px;left:20px;-webkit-mask-image:url('assets/paf-icon.png');}
  /* B: black icon, mask-mode alpha */
  .B{top:20px;left:440px;mask-image:url('assets/paf-icon.png');mask-mode:alpha;-webkit-mask-image:url('assets/paf-icon.png');}
  /* C: white mask, luminance */
  .C{top:440px;left:20px;mask-image:url('assets/paf-mask.png');mask-mode:luminance;-webkit-mask-image:url('assets/paf-mask.png');}
  /* D: white mask default */
  .D{top:440px;left:440px;mask-image:url('assets/paf-mask.png');-webkit-mask-image:url('assets/paf-mask.png');}
</style></head><body>
  <div class="m A"></div><div class="m B"></div><div class="m C"></div><div class="m D"></div>
</body></html>
